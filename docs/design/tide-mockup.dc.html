<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..800&amp;family=Figtree:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; text-align: left; }
input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid #EAF6FF; outline-offset: 2px; }
.scroll::-webkit-scrollbar { display: none; }
.jar { transition: transform .18s; }
.jar:active { transform: scale(.96); }
.fill-in { animation: fill 1.2s cubic-bezier(.3,1.35,.5,1) backwards; }
@keyframes fill {
  from { height: 0; }
}
.wave { animation: wave 5s linear infinite; }
.wave-slow { animation: wave 8s linear infinite reverse; }
@keyframes wave {
  to { transform: translateX(-50%); }
}
.level { transition: height 1.2s cubic-bezier(.3,1.5,.5,1) .42s, background .6s .42s; }
.drop { animation: drop .62s cubic-bezier(.6,0,.9,.6) forwards; }
@keyframes drop {
  from { transform: translateY(0) rotate(-45deg); opacity: 1; }
  88% { opacity: 1; }
  to { transform: translateY(470px) rotate(-45deg); opacity: 0; }
}
.row-in { animation: row .5s cubic-bezier(.2,.9,.3,1.1) backwards; }
@keyframes row {
  from { opacity: 0; transform: translateY(16px); }
}
.sheet { animation: rise .42s cubic-bezier(.2,.9,.3,1) backwards; }
@keyframes rise {
  from { transform: translateY(100%); }
}
.scrim { animation: fade .25s backwards; }
@keyframes fade {
  from { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .wave, .wave-slow { animation: none; }
}
</style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0A1622; color: #EAF6FF; font-family: 'Figtree', 'Segoe UI', sans-serif">

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
      <div style="padding: 60px 20px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 13px; color: #A9C2D6">Owed to you</div>
          <div style="font-family: 'Unbounded', 'Segoe UI', sans-serif; font-weight: 600; font-size: 26px; color: #7CCBFF; font-variant-numeric: tabular-nums">{{ owedText }}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 13px; color: #A9C2D6">You owe</div>
          <div style="font-family: 'Unbounded', 'Segoe UI', sans-serif; font-weight: 600; font-size: 26px; color: #FFAE5C; font-variant-numeric: tabular-nums">{{ oweText }}</div>
        </div>
      </div>

      <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 210px; gap: 12px">
        <sc-for list="{{ people }}" as="p" hint-placeholder-count="5">
          <button class="jar" onClick="{{ p.open }}" aria-label="Open {{ p.name }}, {{ p.tag }} {{ p.amt }}" style="position: relative; overflow: hidden; border-radius: 28px; background: #12263A; display: block; width: 100%">
            <sc-if value="{{ p.wet }}" hint-placeholder-val="{{ true }}">
              <div class="fill-in" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ p.level }}; background: {{ p.color }}; animation-delay: {{ p.delay }}">
                <svg class="wave" viewBox="0 0 800 20" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: -11px; width: 200%; height: 12px; display: block"><path d="M0 10 Q50 -6 100 10 T200 10 T300 10 T400 10 T500 10 T600 10 T700 10 T800 10 V20 H0 Z" fill="{{ p.color }}"></path></svg>
              </div>
            </sc-if>
            <div style="position: absolute; left: 16px; right: 12px; top: 16px; display: flex; flex-direction: column; gap: 5px">
              <div style="font-weight: 600; font-size: 16px">{{ p.name }}</div>
              <div style="font-family: 'Unbounded', 'Segoe UI', sans-serif; font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums">{{ p.amt }}</div>
              <div style="font-size: 13px; color: #A9C2D6">{{ p.tag }}</div>
            </div>
          </button>
        </sc-for>
        <button onClick="{{ newPerson }}" aria-label="Add person" style="border-radius: 28px; border: 2px dashed #A9C2D6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          <div style="font-weight: 600; font-size: 14px">Add person</div>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isPerson }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0">
      <div class="level fill-in" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ person.level }}; background: {{ person.liquid }}">
        <svg class="wave-slow" viewBox="0 0 800 20" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -100%; top: -21px; width: 200%; height: 22px; display: block; opacity: .45"><path d="M0 10 Q50 -6 100 10 T200 10 T300 10 T400 10 T500 10 T600 10 T700 10 T800 10 V20 H0 Z" fill="{{ person.liquid }}"></path></svg>
        <svg class="wave" viewBox="0 0 800 20" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: -15px; width: 200%; height: 16px; display: block"><path d="M0 10 Q50 -6 100 10 T200 10 T300 10 T400 10 T500 10 T600 10 T700 10 T800 10 V20 H0 Z" fill="{{ person.liquid }}"></path></svg>
      </div>

      <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
        <div style="padding: 52px 12px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <button onClick="{{ back }}" aria-label="Back to people" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
          </button>
          <div style="font-weight: 600; font-size: 17px">{{ person.name }}</div>
          <button onClick="{{ editPerson }}" aria-label="Edit {{ person.name }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
          </button>
        </div>

        <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; align-items: center">
          <div style="font-family: 'Unbounded', 'Segoe UI', sans-serif; font-weight: 600; font-size: 52px; font-variant-numeric: tabular-nums; color: {{ person.text }}">{{ person.amt }}</div>
          <div style="font-size: 15px; color: #A9C2D6">{{ person.tag }}</div>
        </div>

        <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{ person.rows }}" as="r" hint-placeholder-count="3">
            <div class="{{ r.cls }}" style="flex: none; background: #12263A; border-radius: 20px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start">
              <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                <div style="font-weight: 600; font-size: 15px">{{ r.label }}</div>
                <sc-if value="{{ r.hasNote }}" hint-placeholder-val="{{ true }}">
                  <div style="font-size: 14px; color: #D2E2EE; line-height: 1.35">{{ r.note }}</div>
                </sc-if>
                <div style="font-size: 13px; color: #A9C2D6">{{ r.date }}</div>
              </div>
              <div style="font-family: 'Unbounded', 'Segoe UI', sans-serif; font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; color: {{ r.color }}">{{ r.amt }}</div>
            </div>
          </sc-for>
        </div>

        <div style="padding: 12px 16px 24px">
          <button onClick="{{ newEntry }}" style="width: 100%; height: 56px; text-align: center; border-radius: 28px; background: #EAF6FF; color: #0A1622; font-weight: 700; font-size: 16px">Add entry</button>
        </div>
      </div>

      <sc-if value="{{ dropping }}" hint-placeholder-val="{{ false }}">
        <div class="drop" aria-hidden="true" style="position: absolute; left: 50%; top: 150px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50% 50% 50% 0; background: {{ dropColor }}; pointer-events: none"></div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ sheetEntry }}" hint-placeholder-val="{{ false }}">
    <button class="scrim" onClick="{{ closeSheet }}" aria-label="Close" style="position: absolute; inset: 0; background: rgba(4, 10, 16, .65)"></button>
    <div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 30px 30px 0 0; background: #12263A; padding: 22px 18px 26px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button onClick="{{ pickGave }}" aria-pressed="{{ gaveOn }}" style="height: 50px; text-align: center; border-radius: 25px; font-weight: 700; background: {{ gaveBg }}; color: {{ gaveFg }}">You gave</button>
        <button onClick="{{ pickGot }}" aria-pressed="{{ gotOn }}" style="height: 50px; text-align: center; border-radius: 25px; font-weight: 700; background: {{ gotBg }}; color: {{ gotFg }}">You got</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="c-amount" style="font-size: 13px; color: #A9C2D6">Amount</label>
        <input id="c-amount" type="text" value="{{ form.amount }}" onChange="{{ onAmount }}" placeholder="0" autocomplete="off" style="height: 60px; border: 0; border-bottom: 2px solid #A9C2D6; background: transparent; color: #EAF6FF; font-family: 'Unbounded', 'Segoe UI', sans-serif; font-weight: 600; font-size: 30px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="c-note" style="font-size: 13px; color: #A9C2D6">Note (optional)</label>
        <input id="c-note" type="text" value="{{ form.note }}" onChange="{{ onNote }}" placeholder="What was it for?" autocomplete="off" style="height: 44px; border: 0; border-bottom: 2px solid #A9C2D6; background: transparent; color: #EAF6FF; font-family: inherit; font-size: 15px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="c-when" style="font-size: 13px; color: #A9C2D6">When: {{ whenHint }}</label>
        <input id="c-when" type="datetime-local" value="{{ form.when }}" onChange="{{ onWhen }}" style="height: 44px; border: 0; border-bottom: 2px solid #A9C2D6; background: transparent; color: #EAF6FF; color-scheme: dark; font-family: inherit; font-size: 14px">
      </div>
      <button onClick="{{ saveEntry }}" style="height: 56px; text-align: center; border-radius: 28px; background: #EAF6FF; color: #0A1622; font-weight: 700; font-size: 16px">Pour it in</button>
    </div>
  </sc-if>

  <sc-if value="{{ sheetPerson }}" hint-placeholder-val="{{ false }}">
    <button class="scrim" onClick="{{ closeSheet }}" aria-label="Close" style="position: absolute; inset: 0; background: rgba(4, 10, 16, .65)"></button>
    <div class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 30px 30px 0 0; background: #12263A; padding: 22px 18px 26px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="c-name" style="font-size: 13px; color: #A9C2D6">Name</label>
        <input id="c-name" type="text" value="{{ form.name }}" onChange="{{ onName }}" autocomplete="off" style="height: 56px; border: 0; border-bottom: 2px solid #A9C2D6; background: transparent; color: #EAF6FF; font-family: 'Unbounded', 'Segoe UI', sans-serif; font-weight: 600; font-size: 22px">
      </div>
      <button onClick="{{ savePerson }}" style="height: 56px; text-align: center; border-radius: 28px; background: #EAF6FF; color: #0A1622; font-weight: 700; font-size: 16px">Save</button>
    </div>
  </sc-if>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { screen: 'home', pid: null, sheet: null, form: {}, people: this.seed(), shown: null, fresh: null, dropping: false, dropColor: '#7CCBFF' };

  seed() {
    const d = (n) => Date.now() - n * 864e5;
    return [
      { id: 'maya', name: 'Maya', entries: [
        { id: 2, dir: 'got', amount: 500, note: 'Paid back at lunch', at: d(3) },
        { id: 1, dir: 'gave', amount: 2000, note: 'Concert tickets, paid for both', at: d(12) } ] },
      { id: 'sam', name: 'Sam', entries: [
        { id: 3, dir: 'got', amount: 4000, note: 'Deposit for the flat', at: d(26) } ] },
      { id: 'tom', name: 'Tom', entries: [
        { id: 5, dir: 'gave', amount: 300, note: '', at: d(6) },
        { id: 4, dir: 'got', amount: 1200, note: 'Covered me at the garage', at: d(20) } ] },
      { id: 'lena', name: 'Lena', entries: [
        { id: 6, dir: 'gave', amount: 650, note: 'Dinner at the airport', at: d(1) } ] },
      { id: 'arjun', name: 'Arjun', entries: [
        { id: 8, dir: 'got', amount: 1000, note: 'Cash', at: d(33) },
        { id: 7, dir: 'gave', amount: 1000, note: 'Train tickets', at: d(40) } ] }
    ];
  }
  bal(p) { return p.entries.reduce((s, e) => s + (e.dir === 'gave' ? e.amount : -e.amount), 0); }
  num(n) { return Math.abs(Math.round(n)).toLocaleString('en-US'); }
  cur() { return this.state.people.find((p) => p.id === this.state.pid); }
  local(ms) { return new Date(ms - new Date(ms).getTimezoneOffset() * 6e4).toISOString().slice(0, 16); }
  day(ms) {
    const dt = new Date(ms), now = new Date();
    const days = Math.round((new Date(now.toDateString()) - new Date(dt.toDateString())) / 864e5);
    const t = dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    if (days === 0) return 'Today, ' + t;
    if (days === 1) return 'Yesterday, ' + t;
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + t;
  }
  tween(from, to) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t0 = performance.now() + 420;
    const step = (t) => {
      const k = Math.max(0, Math.min(1, (t - t0) / 900)), e = 1 - Math.pow(1 - k, 3);
      this.setState({ shown: k < 1 ? from + (to - from) * e : null });
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  saveEntry = () => {
    const f = this.state.form, amount = Number(f.amount);
    if (!amount) return;
    const at = f.edited ? new Date(f.when).getTime() : Date.now();
    const id = Date.now(), from = this.bal(this.cur());
    const people = this.state.people.map((p) => p.id !== this.state.pid ? p : {
      ...p, entries: [...p.entries, { id, dir: f.dir, amount, note: f.note.trim(), at }].sort((a, b) => b.at - a.at)
    });
    this.setState({ people, sheet: null, fresh: id, dropping: true, dropColor: f.dir === 'gave' ? '#7CCBFF' : '#FFAE5C' });
    setTimeout(() => this.setState({ dropping: false }), 700);
    this.tween(from, from + (f.dir === 'gave' ? amount : -amount));
  };
  savePerson = () => {
    const name = (this.state.form.name || '').trim();
    if (!name) return;
    const { pid, people, form } = this.state;
    this.setState({
      sheet: null,
      people: form.editing ? people.map((p) => p.id === pid ? { ...p, name } : p)
        : [{ id: 'p' + Date.now(), name, entries: [] }, ...people]
    });
  };
  setForm(patch) { this.setState({ form: { ...this.state.form, ...patch } }); }

  renderVals() {
    const s = this.state, IN = '#7CCBFF', OUT = '#FFAE5C', TEXT = '#EAF6FF', DARK = '#0A1622';
    const liquid = (b) => b >= 0 ? IN : OUT;
    const totals = s.people.map((p) => this.bal(p));
    const max = Math.max(1, ...totals.map(Math.abs));
    const people = s.people.map((p, i) => {
      const b = totals[i], r = Math.min(1, Math.abs(b) / max);
      return { id: p.id, name: p.name, amt: this.num(b), color: liquid(b), wet: b !== 0, delay: i * 90 + 'ms',
        level: (10 + 42 * r).toFixed(1) + '%',
        tag: b > 0 ? 'owes you' : b < 0 ? 'you owe' : 'all square',
        open: () => this.setState({ screen: 'person', pid: p.id, fresh: null, shown: null }) };
    });
    const cur = this.cur();
    let person = { name: '', rows: [], amt: '', tag: '', liquid: IN, text: TEXT, level: '0%' };
    if (cur) {
      const b = this.bal(cur), r = Math.min(1, Math.abs(b) / max);
      person = { name: cur.name, amt: this.num(s.shown ?? b), liquid: liquid(b), text: b === 0 ? TEXT : liquid(b),
        level: b === 0 ? '0%' : (24 + 38 * r).toFixed(1) + '%',
        tag: b > 0 ? cur.name + ' owes you' : b < 0 ? 'You owe ' + cur.name : 'All square',
        rows: cur.entries.map((e, i) => ({ id: e.id, date: this.day(e.at), label: e.dir === 'gave' ? 'You gave' : 'You got',
          amt: this.num(e.amount), color: e.dir === 'gave' ? IN : OUT, note: e.note, hasNote: !!e.note,
          cls: e.id === s.fresh || s.fresh === null ? 'row-in' : '' })) };
    }
    const gave = s.form.dir !== 'got';
    return {
      isHome: s.screen === 'home', isPerson: s.screen === 'person',
      sheetEntry: s.sheet === 'entry', sheetPerson: s.sheet === 'person',
      people, person, form: s.form, dropping: s.dropping, dropColor: s.dropColor,
      owedText: this.num(totals.filter((b) => b > 0).reduce((a, b) => a + b, 0)),
      oweText: this.num(totals.filter((b) => b < 0).reduce((a, b) => a + b, 0)),
      gaveOn: gave, gotOn: !gave,
      gaveBg: gave ? IN : '#1D3850', gaveFg: gave ? DARK : TEXT,
      gotBg: gave ? '#1D3850' : OUT, gotFg: gave ? TEXT : DARK,
      whenHint: s.form.edited ? 'set by you' : 'now',
      back: () => this.setState({ screen: 'home', pid: null }),
      closeSheet: () => this.setState({ sheet: null }),
      newPerson: () => this.setState({ sheet: 'person', form: { name: '', editing: false } }),
      editPerson: () => this.setState({ sheet: 'person', form: { name: this.cur().name, editing: true } }),
      newEntry: () => this.setState({ sheet: 'entry', form: { dir: 'gave', amount: '', note: '', when: this.local(Date.now()), edited: false } }),
      pickGave: () => this.setForm({ dir: 'gave' }), pickGot: () => this.setForm({ dir: 'got' }),
      onAmount: (e) => this.setForm({ amount: e.target.value.replace(/[^0-9]/g, '') }),
      onNote: (e) => this.setForm({ note: e.target.value }),
      onWhen: (e) => this.setForm({ when: e.target.value, edited: true }),
      onName: (e) => this.setForm({ name: e.target.value }),
      saveEntry: this.saveEntry, savePerson: this.savePerson
    };
  }
}
</script>
</body>
</html>
